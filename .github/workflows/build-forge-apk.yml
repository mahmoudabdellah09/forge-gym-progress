name: Build Forge APK

on:
  workflow_dispatch:
  push:
    paths:
      - "gym-progress-app/**"
      - ".github/workflows/build-forge-apk.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gym-progress-app
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gym-progress-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm test

      - name: Prepare web bundle
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Set broad Android compatibility
        working-directory: gym-progress-app
        run: |
          python -c "from pathlib import Path; import re; p=Path('android/variables.gradle'); s=p.read_text(); s=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 23', s); s=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 35', s); s=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 35', s); p.write_text(s)"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: gym-progress-app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-universal-apk
          path: gym-progress-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
