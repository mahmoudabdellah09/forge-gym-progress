services:
  - type: web
    name: forge-gym-progress
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: FORGE_DATA_FILE
        value: /var/data/data.json
    disk:
      name: forge-data
      mountPath: /var/data
      sizeGB: 1
